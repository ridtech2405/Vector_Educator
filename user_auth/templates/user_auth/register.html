{% load static %}
<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Vector_Educator | Sign Up</title>
  <link rel="icon" href="{% static 'images/favicon.ico' %}" />
  <link rel="stylesheet" href="{% static 'user_auth/css/register.css' %}" />
</head>
<body>
  <div class="bg" aria-hidden="true">
    <div class="grid"></div>
    <div class="orb orb-a"></div>
    <div class="orb orb-b"></div>
    <div class="orb orb-c"></div>
    <div class="float-shapes">
      <span class="shape s1"></span>
      <span class="shape s2"></span>
      <span class="shape s3"></span>
      <span class="shape s4"></span>
      <span class="shape s5"></span>
    </div>
  </div>

  <main class="shell">
    <section class="card" role="region" aria-label="Signup">
      <div id="register-top" aria-hidden="true" hidden></div>

      <header class="brand">
        <div class="brand-mark" aria-hidden="true">
          <svg width="34" height="34" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path d="M12 2C7.03 2 3 6.03 3 11C3 16.52 7.48 21.1 13.03 20.98C16.98 20.9 20.52 18.33 21.62 14.58C21.84 13.82 21.5 13 20.78 12.65L16.5 10.55C15.86 10.24 15.1 10.46 14.7 11.05L13.62 12.63C13.18 13.27 12.28 13.38 11.7 12.9C10.85 12.2 10.16 11.45 9.56 10.58C9.1 9.92 9.27 9.01 9.91 8.57L11.57 7.43C12.14 7.03 12.32 6.26 12 5.63L9.95 1.36C9.6 0.64 8.78 0.31 8.02 0.53C7.35 0.73 6.72 1.01 6.15 1.35C5.3 1.86 4.53 2.5 3.92 3.22" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
            <path d="M12 6V12L16 14" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </div>
        <div class="brand-text">
          <div class="name">Vector_Educator</div>
          <div class="tag">Premium learning, built for real progress.</div>
        </div>
      </header>

      <div class="title-block">
        <h1 class="h1">Join Vector_Educator</h1>
        <p class="sub">Start your personalized learning journey today.</p>
      </div>

      <form class="form" method="post" action="" novalidate>
        <input type="hidden" name="csrfmiddlewaretoken" value="{{ csrf_token }}" />

        <div class="grid2">
          <div class="field">
            <label for="full_name" class="label">Full Name</label>
            <div class="control">
              <input id="full_name" name="full_name" type="text" placeholder="Enter your full name" autocomplete="name" required />
            </div>
          </div>

          <div class="field">
            <label for="email" class="label">Email Address</label>
            <div class="control has-icon">
              <span class="icon" aria-hidden="true">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                  <path d="M4 7.5C4 6.12 5.12 5 6.5 5H17.5C18.88 5 20 6.12 20 7.5V16.5C20 17.88 18.88 19 17.5 19H6.5C5.12 19 4 17.88 4 16.5V7.5Z" stroke="currentColor" stroke-width="1.7"/>
                  <path d="M6 8L12 12L18 8" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/>
                </svg>
              </span>
              <input id="email" name="email" type="email" placeholder="you@example.com" autocomplete="email" required />
            </div>
          </div>
        </div>

        <div class="grid2">
          <div class="field">
            <label for="mobile" class="label">Mobile Number</label>
            <div class="control">
              <input id="mobile" name="mobile" type="tel" inputmode="numeric" placeholder="10-digit mobile number" autocomplete="tel" required />
            </div>
          </div>

          <div class="field">
            <label for="class_level" class="label">Class Selection</label>
            <div class="control">
              <select id="class_level" name="class_level" required>
                <option value="" selected disabled>Select Class</option>
                <option value="9">Class 9</option>
                <option value="10">Class 10</option>
                <option value="11">Class 11</option>
                <option value="12">Class 12</option>
              </select>
            </div>
          </div>
        </div>

        <div class="field">
          <label for="board" class="label">Board Selection</label>
          <div class="control">
            <select id="board" name="board" required>
              <option value="" selected disabled>Select Board</option>
              <option value="cbse">CBSE Board</option>
              <option value="bihar">Bihar Board</option>
            </select>
          </div>
          <p class="hint">We’ll tailor your study plan for your board.</p>
        </div>

        <div class="field">
          <label for="password" class="label">Password</label>
          <div class="control has-icon">
            <span class="icon" aria-hidden="true">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                <path d="M7 11V8.5C7 6.01472 9.01472 4 11.5 4C13.9853 4 16 6.01472 16 8.5V11" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/>
                <path d="M6.5 11H17.5C18.6046 11 19.5 11.8954 19.5 13V18C19.5 19.1046 18.6046 20 17.5 20H6.5C5.39543 20 4.5 19.1046 4.5 18V13C4.5 11.8954 5.39543 11 6.5 11Z" stroke="currentColor" stroke-width="1.7"/>
              </svg>
            </span>
            <input id="password" name="password" type="password" placeholder="Create a strong password" autocomplete="new-password" required />
            <button class="pw-toggle" type="button" data-toggle="password" aria-label="Toggle password visibility">
              <span class="pw-eye" aria-hidden="true">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                  <path d="M2 12C4.5 7.5 8 5 12 5C16 5 19.5 7.5 22 12C19.5 16.5 16 19 12 19C8 19 4.5 16.5 2 12Z" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"/>
                  <path d="M12 15C13.6569 15 15 13.6569 15 12C15 10.3431 13.6569 9 12 9C10.3431 9 9 10.3431 9 12C9 13.6569 10.3431 15 12 15Z" stroke="currentColor" stroke-width="1.7"/>
                </svg>
              </span>
            </button>
          </div>

          <div class="pw-strength" aria-live="polite">
            <div class="pw-strength-top">
              <span class="pw-strength-label">Password strength</span>
              <span id="pw-strength-text" class="pw-strength-text">—</span>
            </div>
            <div class="pw-strength-bar" aria-hidden="true"><span class="pw-strength-fill"></span></div>
            <div class="pw-strength-states" aria-hidden="true">
              <span id="pw-state-weak" class="pw-state">Weak</span>
              <span id="pw-state-med" class="pw-state">Medium</span>
              <span id="pw-state-strong" class="pw-state">Strong</span>
            </div>
          </div>
        </div>

        <div class="field">
          <label for="confirm_password" class="label">Confirm Password</label>
          <div class="control has-icon">
            <span class="icon" aria-hidden="true">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                <path d="M7 11V8.5C7 6.01472 9.01472 4 11.5 4C13.9853 4 16 6.01472 16 8.5V11" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/>
                <path d="M6.5 11H17.5C18.6046 11 19.5 11.8954 19.5 13V18C19.5 19.1046 18.6046 20 17.5 20H6.5C5.39543 20 4.5 19.1046 4.5 18V13C4.5 11.8954 5.39543 11 6.5 11Z" stroke="currentColor" stroke-width="1.7"/>
              </svg>
            </span>
            <input id="confirm_password" name="confirm_password" type="password" placeholder="Re-enter your password" autocomplete="new-password" required />
            <button class="pw-toggle" type="button" data-toggle="confirm_password" aria-label="Toggle confirm password visibility">
              <span class="pw-eye" aria-hidden="true">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                  <path d="M2 12C4.5 7.5 8 5 12 5C16 5 19.5 7.5 22 12C19.5 16.5 16 19 12 19C8 19 4.5 16.5 2 12Z" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"/>
                  <path d="M12 15C13.6569 15 15 13.6569 15 12C15 10.3431 13.6569 9 12 9C10.3431 9 9 10.3431 9 12C9 13.6569 10.3431 15 12 15Z" stroke="currentColor" stroke-width="1.7"/>
                </svg>
              </span>
            </button>
          </div>
        </div>

        <button class="btn primary" type="submit" id="signupBtn">
          <span class="btn-bg" aria-hidden="true"></span>
          <span class="btn-content">Sign Up</span>
          <span class="btn-loader" aria-hidden="true" hidden></span>
          <span class="btn-ripple" aria-hidden="true"></span>
        </button>

        <p class="foot">
          Already have an account? <a class="link strong" href="{% url 'user_auth:login' %}">Sign In</a>
        </p>
      </form>
    </section>
  </main>

  <script src="{% static 'user_auth/js/register.js' %}"></script>
</body>
</html>
