<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>JEE Dashboard</title>

<style>
    *{
        margin:0;
        padding:0;
        box-sizing:border-box;
        font-family: Arial, sans-serif;
    }

    body{
        background:#f4f6f9;
    }

    .header{
        background:#1e3a8a;
        color:white;
        padding:15px 30px;
        display:flex;
        justify-content:space-between;
        align-items:center;
    }

    .container{
        padding:20px;
    }

    .cards{
        display:grid;
        grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
        gap:20px;
        margin-top:20px;
    }

    .card{
        background:white;
        padding:20px;
        border-radius:12px;
        box-shadow:0 4px 10px rgba(0,0,0,0.1);
        text-align:center;
    }

    .card h2{
        color:#1e3a8a;
        margin-bottom:10px;
    }

    .card p{
        font-size:24px;
        font-weight:bold;
    }

    .table-box{
        background:white;
        margin-top:30px;
        padding:20px;
        border-radius:12px;
        box-shadow:0 4px 10px rgba(0,0,0,0.1);
    }

    table{
        width:100%;
        border-collapse:collapse;
    }

    th,td{
        padding:12px;
        border-bottom:1px solid #ddd;
        text-align:left;
    }

    th{
        background:#1e3a8a;
        color:white;
    }
</style>
</head>

<body>

<div class="header">
    <h1>JEE Student Dashboard</h1>
    <h3>Welcome, Student</h3>
</div>

<div class="container">

    <div class="cards">
        <div class="card">
            <h2>Mock Tests</h2>
            <p>25</p>
        </div>

        <div class="card">
            <h2>Physics Score</h2>
            <p>88%</p>
        </div>

        <div class="card">
            <h2>Chemistry Score</h2>
            <p>82%</p>
        </div>

        <div class="card">
            <h2>Maths Score</h2>
            <p>91%</p>
        </div>
    </div>

    <div class="table-box">
        <h2>Recent Test Performance</h2>
        <br>

        <table>
            <tr>
                <th>Test Name</th>
                <th>Date</th>
                <th>Score</th>
                <th>Rank</th>
            </tr>

            <tr>
                <td>JEE Mock Test 1</td>
                <td>15 June 2026</td>
                <td>220/300</td>
                <td>125</td>
            </tr>

            <tr>
                <td>JEE Mock Test 2</td>
                <td>18 June 2026</td>
                <td>245/300</td>
                <td>78</td>
            </tr>

            <tr>
                <td>JEE Mock Test 3</td>
                <td>20 June 2026</td>
                <td>260/300</td>
                <td>42</td>
            </tr>
        </table>
    </div>

</div>

</body>
</html>
